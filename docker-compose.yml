services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: wombo
      MARIADB_USER: KristianTalgo
      MARIADB_PASSWORD: 159355
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=9f3c8a2b7e4d1c6a9b0e2f5a8c3a7b1e4f6d9c2a1b8e7f5d3c4a2b1e9f6d8c4
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=wombo
      - DB_USER=KristianTalgo
      - DB_PASSWORD=159355
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
